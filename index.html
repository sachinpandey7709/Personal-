<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKP Multimedia Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>▶ SKP Multimedia Library</h2>

    <input type="search" id="search"
           placeholder="Search videos and audio...">
</header>

<nav>
    <button onclick="filterVideos('All')">All Files</button>
    <button onclick="filterVideos('Movies')">Movies</button>
    <button onclick="filterVideos('Education')">Education</button>
    <button onclick="filterVideos('Music')">Music</button>
    <button onclick="filterVideos('Personal')">Personal</button>
    <button onclick="filterVideos('Favourites')">❤️ Favourites</button>
</nav>

<main>

    <section class="upload-box">

        <h2>Upload Video & Audio</h2>

        <input type="file"
               id="videoFile"
               accept="video/*,audio/*,.ts,.mkv,.avi,.flv">

        <input type="text"
               id="videoName"
               placeholder="Enter file name">

        <select id="category">

            <option value="Movies">Movies</option>
            <option value="Education">Education</option>
            <option value="Music">Music</option>
            <option value="Personal">Personal</option>
            <option value="Other">Other</option>

        </select>

        <button onclick="uploadVideo()">
            Upload File
        </button>

        <p id="status"></p>

    </section>

    <h2 class="heading">My Multimedia Collection</h2>

    <div id="videoContainer" class="video-grid"></div>

</main>

<!-- MEDIA PLAYER MODAL -->

<div id="playerModal" class="modal">

    <div class="player-box">

        <button class="close" onclick="closePlayer()">✕</button>

        <div id="mediaPlayerArea"></div>

        <h3 id="playerTitle"></h3>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
